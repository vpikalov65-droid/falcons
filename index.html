<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Falcons</title>
  <style>
    :root {
      --cyan: #39f3ff;
      --magenta: #ff2bd6;
      --good: #c6ff6a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(ellipse at center, #140816 0%, #000 68%);
      color: #f4fbff;
      font-family: "Courier New", Menlo, monospace;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    /* Поле 800×600 по центру. При изменении окна сохраняются пропорции. */
    #stage {
      position: relative;
      width: min(100vw, calc(100dvh * 4 / 3));
      aspect-ratio: 4 / 3;
      font-size: calc(min(100vw, calc(100dvh * 4 / 3)) / 42);
      outline: none;
      background: #000;
      box-shadow:
        0 0 0 4px #12060f,
        0 0 0 8px #4a1848,
        0 24px 80px rgba(0, 0, 0, 0.6);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #scan {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.18) 0 1px,
          transparent 1px 4px
        ),
        radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.45) 100%);
    }

    #screen {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 1.2em;
      background: rgba(0, 0, 0, 0.55);
    }

    #screen[hidden] { display: none !important; }

    .panel {
      width: min(92%, 24em);
      padding: 1.15em 1.2em 1.3em;
      text-align: center;
      background: rgba(4, 0, 10, 0.92);
      border: 2px solid var(--magenta);
      box-shadow:
        0 0 22px rgba(255, 43, 214, 0.38),
        inset 0 0 28px rgba(57, 243, 255, 0.08);
    }

    .kicker {
      margin: 0;
      letter-spacing: 0.34em;
      font-size: 0.72em;
      color: var(--cyan);
    }

    h1 {
      margin: 0.28em 0 0.35em;
      font-size: 3.05em;
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1;
    }

    h1.title {
      color: var(--cyan);
      text-shadow: 0 0 14px rgba(57, 243, 255, 0.85);
    }

    h1.over {
      color: #ff4d6d;
      text-shadow: 0 0 16px rgba(255, 60, 100, 0.9);
      animation: blink 1s steps(2, end) infinite;
    }

    .line {
      margin: 0.2em 0;
      font-size: 1.15em;
      letter-spacing: 0.12em;
      color: var(--good);
      text-shadow: 0 0 8px rgba(198, 255, 106, 0.65);
    }

    .hint {
      margin: 0.85em 0 1em;
      font-size: 0.78em;
      line-height: 1.55;
      letter-spacing: 0.04em;
      color: rgba(232, 246, 255, 0.82);
      white-space: pre-line;
    }

    button {
      font: inherit;
      font-size: 0.95em;
      letter-spacing: 0.14em;
      color: var(--good);
      background: transparent;
      border: 2px solid var(--good);
      padding: 0.65em 1.15em;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(198, 255, 106, 0.35);
    }

    button:hover,
    button:focus-visible {
      background: rgba(198, 255, 106, 0.16);
      outline: none;
    }

    @keyframes blink {
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div id="stage" tabindex="0">
    <canvas id="view" width="800" height="600" aria-label="Игровое поле Falcons"></canvas>
    <div id="scan" aria-hidden="true"></div>
    <div id="screen">
      <div class="panel">
        <p class="kicker" id="kicker">ARCADE 199X</p>
        <h1 id="heading" class="title">FALCONS</h1>
        <p class="line" id="line-score" hidden>СЧЁТ 000000</p>
        <p class="line" id="line-best" hidden>РЕКОРД 000000</p>
        <p class="hint" id="hint">Стрелки влево и вправо — движение бластера
Пробел — одиночный выстрел</p>
        <button type="button" id="action">Играть</button>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    /**
     * FALCONS — 2D ретро-шутер.
     * Один файл: откройте index.html двойным щелчком. Сервер и аудиофайлы не нужны.
     * Звук синтезируется Web Audio API после первого нажатия или щелчка.
     *
     * 1. Поле, математика, звук
     * 2. Состояние и ввод
     * 3. Бластер, точки, соколы, снаряды, столкновения
     * 4. Отрисовка
     * 5. Цикл: симуляция ровно 60 шагов в секунду, кадр — requestAnimationFrame
     */

    // --- 1. Поле -----------------------------------------------------------

    const W = 800;
    const H = 600;
    const WALL = 36;
    const FLOOR = 548;
    const PLAY_L = WALL;
    const PLAY_R = W - WALL;

    const PLAYER_SPEED = 420;
    const BULLET_SPEED = 760;
    const SHOT_GAP = 0.2;
    const FALCON_R = 16;
    const MORPH_TIME = 0.32;
    const STEP = 1 / 60;

    const canvas = document.getElementById("view");
    const ctx = canvas.getContext("2d");
    const stage = document.getElementById("stage");
    const screenEl = document.getElementById("screen");
    const kickerEl = document.getElementById("kicker");
    const headingEl = document.getElementById("heading");
    const lineScoreEl = document.getElementById("line-score");
    const lineBestEl = document.getElementById("line-best");
    const hintEl = document.getElementById("hint");
    const actionEl = document.getElementById("action");

    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    function fitCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
    }

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function pad(n) { return String(Math.max(0, n | 0)).padStart(6, "0"); }

    function hexRgb(h) {
      return [
        parseInt(h.slice(1, 3), 16),
        parseInt(h.slice(3, 5), 16),
        parseInt(h.slice(5, 7), 16),
      ];
    }

    function mixHex(a, b, t) {
      const pa = hexRgb(a);
      const pb = hexRgb(b);
      const u = clamp(t, 0, 1);
      const c = pa.map((v, i) => Math.round(v + (pb[i] - v) * u));
      return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")";
    }

    function loadBest() {
      try { return Number(localStorage.getItem("falcons-best")) || 0; }
      catch (err) { return 0; }
    }

    function saveBest(n) {
      try { localStorage.setItem("falcons-best", String(n)); }
      catch (err) { /* файл открыт так, что хранилище недоступно */ }
    }

    // --- Звук: выстрел, взрыв, game over. Внешних файлов нет. -------------

    const sfx = {
      ctx: null,
      master: null,
      noise: null,

      unlock() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        try {
          if (!this.ctx) {
            this.ctx = new AC();
            this.master = this.ctx.createGain();
            this.master.gain.value = 0.7;
            const comp = this.ctx.createDynamicsCompressor();
            comp.threshold.value = -16;
            comp.knee.value = 8;
            comp.ratio.value = 6;
            comp.attack.value = 0.003;
            comp.release.value = 0.12;
            this.master.connect(comp);
            comp.connect(this.ctx.destination);

            const len = this.ctx.sampleRate;
            const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
            this.noise = buf;
          }
          if (this.ctx.state === "suspended") this.ctx.resume();
          return true;
        } catch (err) {
          return false;
        }
      },

      tone(when, freq, dur, type, gain, slideTo) {
        if (!this.unlock()) return;
        const t = this.ctx.currentTime + when;
        const osc = this.ctx.createOscillator();
        const amp = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
        }
        amp.gain.setValueAtTime(gain, t);
        amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(amp);
        amp.connect(this.master);
        osc.start(t);
        osc.stop(t + dur + 0.03);
      },

      burst(when, dur, freq, gain) {
        if (!this.unlock()) return;
        const t = this.ctx.currentTime + when;
        const src = this.ctx.createBufferSource();
        src.buffer = this.noise;
        const filter = this.ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = freq;
        filter.Q.value = 0.7;
        const amp = this.ctx.createGain();
        amp.gain.setValueAtTime(gain, t);
        amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(filter);
        filter.connect(amp);
        amp.connect(this.master);
        src.start(t);
        src.stop(t + dur);
      },

      shoot() {
        this.tone(0, 940, 0.07, "square", 0.07, 160);
        this.burst(0, 0.04, 1800, 0.08);
      },

      explode() {
        this.burst(0, 0.24, 900, 0.36);
        this.tone(0, 190, 0.18, "sawtooth", 0.07, 48);
      },

      gameOver() {
        this.burst(0, 0.55, 240, 0.42);
        this.tone(0, 440, 0.2, "square", 0.08, 170);
        this.tone(0.16, 220, 0.26, "square", 0.08, 80);
        this.tone(0.34, 110, 0.46, "sawtooth", 0.09, 36);
      },
    };

    // --- 2. Состояние ------------------------------------------------------

    const PALETTES = [
      { body: "#ffb03a", wing: "#ff4d1f", edge: "#ffe1b0" },
      { body: "#ff8ad4", wing: "#ff2d6a", edge: "#ffd4ea" },
      { body: "#ffe14a", wing: "#ff7a18", edge: "#fff3c4" },
    ];

    const keys = { left: false, right: false };

    const stars = Array.from({ length: 72 }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      z: Math.random(),
      tw: Math.random() * Math.PI * 2,
    }));

    const player = { x: W / 2, y: FLOOR - 18, lock: 0 };
    let mode = "menu"; // menu | play | over
    let score = 0;
    let best = loadBest();
    let time = 0;
    let elapsed = 0;
    let spawnIn = 0.6;
    let shake = 0;
    let flash = 0;

    const enemies = [];
    const bullets = [];
    const particles = [];
    const rings = [];
    const popups = [];
    const flashes = [];

    function resetMatch() {
      score = 0;
      elapsed = 0;
      spawnIn = 0.45;
      shake = 0;
      flash = 0;
      player.x = W / 2;
      player.lock = 0;
      enemies.length = 0;
      bullets.length = 0;
      particles.length = 0;
      rings.length = 0;
      popups.length = 0;
      flashes.length = 0;
    }

    function showMenu() {
      mode = "menu";
      kickerEl.textContent = "ARCADE 199X";
      headingEl.textContent = "FALCONS";
      headingEl.className = "title";
      lineScoreEl.hidden = true;
      hintEl.hidden = false;
      hintEl.textContent = "Стрелки влево и вправо — движение бластера\nПробел — одиночный выстрел";
      actionEl.textContent = "Играть";
      lineBestEl.hidden = best <= 0;
      lineBestEl.textContent = "РЕКОРД " + pad(best);
      screenEl.hidden = false;
    }

    function showOver(isRecord) {
      kickerEl.textContent = isRecord ? "НОВЫЙ РЕКОРД" : "КОНЕЦ ИГРЫ";
      headingEl.textContent = "GAME OVER";
      headingEl.className = "over";
      lineScoreEl.hidden = false;
      lineScoreEl.textContent = "СЧЁТ " + pad(score);
      lineBestEl.hidden = false;
      lineBestEl.textContent = "РЕКОРД " + pad(best);
      hintEl.hidden = false;
      hintEl.textContent = "Пробел или кнопка — начать заново";
      actionEl.textContent = "Начать заново";
      screenEl.hidden = false;
    }

    function startGame() {
      sfx.unlock();
      resetMatch();
      mode = "play";
      screenEl.hidden = true;
      actionEl.blur();
      stage.focus();
    }

    function endGame() {
      if (mode !== "play") return;
      mode = "over";
      shake = 1;
      flash = 1;
      burst(player.x, player.y, "#7af7ff", 28, 300);
      burst(player.x, player.y, "#ff4d6d", 16, 180);
      sfx.gameOver();
      const previous = best;
      if (score > best) {
        best = score;
        saveBest(best);
      }
      showOver(score > previous && score > 0);
    }

    // --- 3. Сущности и честные хитбоксы ------------------------------------
    // Снаряд — вертикальный штрих. Его попадание считается по отрезку пути,
    // поэтому быстрая пуля не проскакивает сквозь маленькую точку.
    // Хитбокс бластера — корпус без огня двигателя.
    // Хитбокс сокола — круг, который накрывает корпус и кончики крыльев.
    // Точка и вспышка превращения бластер не убивают: конец игры только
    // от столкновения уже родившегося сокола с кораблём.

    function playerBox() {
      return { x: player.x - 16, y: player.y - 16, w: 32, h: 26 };
    }

    function circleHitsRect(cx, cy, r, box) {
      const nx = clamp(cx, box.x, box.x + box.w);
      const ny = clamp(cy, box.y, box.y + box.h);
      const dx = cx - nx;
      const dy = cy - ny;
      return dx * dx + dy * dy <= r * r;
    }

    function pointSegDist(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len2 = dx * dx + dy * dy;
      let t = len2 > 0 ? ((px - x1) * dx + (py - y1) * dy) / len2 : 0;
      t = clamp(t, 0, 1);
      const ex = px - (x1 + dx * t);
      const ey = py - (y1 + dy * t);
      return Math.hypot(ex, ey);
    }

    function bulletHits(b, x, y, radius) {
      const top = Math.min(b.prevY, b.y) - 8;
      const bot = Math.max(b.prevY, b.y) + 6;
      return pointSegDist(x, y, b.x, top, b.x, bot) <= radius + 2.5;
    }

    function dotRadius(e) {
      return 3.2 + clamp(e.grow, 0, 1) * 9;
    }

    function hitRadius(e) {
      if (e.kind === "dot") return dotRadius(e);
      if (e.kind === "morph") {
        const k = 1 - e.morph / MORPH_TIME;
        return lerp(dotRadius(e), FALCON_R, k);
      }
      return FALCON_R;
    }

    function pointsFor(e) {
      if (e.kind === "falcon") return 250;
      if (e.kind === "morph") return 200;
      return 50 + Math.round(clamp(e.grow, 0, 1) * 100);
    }

    function burst(x, y, color, count, speed) {
      for (let i = 0; i < count; i++) {
        const a = (Math.PI * 2 * i) / count + Math.random() * 0.4;
        const s = speed * (0.35 + Math.random() * 0.7);
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 0.28 + Math.random() * 0.4,
          age: 0,
          size: 2 + (Math.random() * 2 | 0),
          color: color,
        });
      }
      rings.push({ x: x, y: y, r: 6, vr: speed * 0.9, life: 0.36, age: 0, color: color });
      if (particles.length > 240) particles.splice(0, particles.length - 240);
    }

    function popup(x, y, text) {
      popups.push({ x: x, y: y, text: text, life: 0.7, age: 0 });
    }

    function spawnDot() {
      const ramp = clamp(elapsed / 75, 0, 1);
      const margin = 30;
      enemies.push({
        kind: "dot",
        x: PLAY_L + margin + Math.random() * (PLAY_R - PLAY_L - margin * 2),
        y: -18,
        homeY: 70 + Math.random() * 160,
        vx: (Math.random() < 0.5 ? -1 : 1) * (48 + Math.random() * 90 + ramp * 50),
        phase: Math.random() * Math.PI * 2,
        grow: 0,
        growTime: lerp(3.5, 1.85, ramp) * (0.86 + Math.random() * 0.28),
        pulse: Math.random() * Math.PI * 2,
        morph: 0,
        diveT: 0,
        aimX: null,
        vy: 0,
        flap: 0,
        prevX: 0,
        prevY: -18,
        trail: [],
        pal: PALETTES[(Math.random() * PALETTES.length) | 0],
      });
    }

    function hatch(e) {
      e.kind = "falcon";
      e.diveT = 0;
      e.aimX = null;
      e.vy = 30;
      e.vx = 0;
      e.flap = 0;
      e.trail = [];
    }

    function updatePlayer(dt) {
      const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      player.x += dir * PLAYER_SPEED * dt;
      player.x = clamp(player.x, PLAY_L + 16, PLAY_R - 16);
    }

    function shoot() {
      if (mode !== "play") return;
      if (time < player.lock) return;
      player.lock = time + SHOT_GAP;
      const muzzle = player.y - 20;
      bullets.push({ x: player.x, y: muzzle, prevY: muzzle });
      flashes.push({ x: player.x, y: player.y - 18, life: 0.05, age: 0 });
      sfx.shoot();
    }

    function updateSpawn(dt) {
      spawnIn -= dt;
      if (spawnIn > 0) return;
      if (enemies.length >= 6) {
        spawnIn = 0.28;
        return;
      }
      spawnDot();
      const ramp = clamp(elapsed / 75, 0, 1);
      spawnIn = lerp(1.75, 0.58, ramp) * (0.78 + Math.random() * 0.45);
    }

    function updateDotMotion(e, dt) {
      const hover = e.homeY + Math.sin(time * 2.2 + e.phase) * 16;
      e.y += (hover - e.y) * (1 - Math.exp(-1.8 * dt));
      e.x += e.vx * dt;
      const padR = hitRadius(e) + 2;
      if (e.x < PLAY_L + padR) { e.x = PLAY_L + padR; e.vx = Math.abs(e.vx); }
      if (e.x > PLAY_R - padR) { e.x = PLAY_R - padR; e.vx = -Math.abs(e.vx); }
      e.pulse += dt * (7 + e.grow * 10);
    }

    /**
     * Пикирование. Первые 0.4 с сокол почти висит — это предупреждение.
     * Дальше он берёт курс на бластер, но у пола доворот слабеет,
     * поэтому шаг в сторону в нижней трети экрана уводит от удара.
     */
    function updateFalcon(e, dt) {
      e.diveT += dt;
      e.flap += dt * (8 + e.vy * 0.025);
      e.trail.push({ x: e.x, y: e.y });
      if (e.trail.length > 5) e.trail.shift();

      if (e.diveT < 0.4) {
        e.vy += (26 - e.vy) * (1 - Math.exp(-3 * dt));
        e.x += Math.sin(e.diveT * 16 + e.phase) * 28 * dt;
        e.y += e.vy * dt;
        e.x = clamp(e.x, PLAY_L + FALCON_R, PLAY_R - FALCON_R);
        return;
      }

      if (e.aimX == null) e.aimX = player.x;
      const depth = clamp((e.y - 80) / (FLOOR - 180), 0, 1);
      const track = lerp(2.6, 0.18, depth);
      e.aimX += (player.x - e.aimX) * Math.min(1, dt * track);
      const sway = Math.sin(e.diveT * 4 + e.phase) * lerp(28, 8, depth);
      const desired = e.aimX + sway;
      e.vx += (desired - e.x) * (1 - Math.exp(-4.5 * dt)) * 3.2;
      e.vx = clamp(e.vx, -320, 320);
      const accel = 280 + Math.min(180, elapsed * 2.2);
      e.vy = Math.min(520, e.vy + accel * dt);
      e.x += e.vx * dt;
      e.y += e.vy * dt;
      if (e.x < PLAY_L + FALCON_R) { e.x = PLAY_L + FALCON_R; e.vx *= -0.35; }
      if (e.x > PLAY_R - FALCON_R) { e.x = PLAY_R - FALCON_R; e.vx *= -0.35; }
    }

    function updateEnemies(dt) {
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        e.prevX = e.x;
        e.prevY = e.y;
        if (e.kind === "dot") {
          updateDotMotion(e, dt);
          e.grow += dt / e.growTime;
          if (e.grow >= 1) {
            e.grow = 1;
            e.kind = "morph";
            e.morph = MORPH_TIME;
          }
        } else if (e.kind === "morph") {
          updateDotMotion(e, dt);
          e.pulse += dt * 18;
          e.morph -= dt;
          if (e.morph <= 0) hatch(e);
        } else {
          updateFalcon(e, dt);
        }
      }
    }

    function updateBullets(dt) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.prevY = b.y;
        b.y -= BULLET_SPEED * dt;
        if (b.y < -30) bullets.splice(i, 1);
      }
    }

    function killEnemy(index) {
      const e = enemies[index];
      const pts = pointsFor(e);
      score += pts;
      const color = e.kind === "dot" ? "#ffe56a" : e.pal.wing;
      const heavy = e.kind === "falcon";
      burst(e.x, e.y, color, heavy ? 22 : 12, heavy ? 250 : 150);
      popup(e.x, e.y - 10, "+" + pts);
      shake = Math.min(1, shake + (heavy ? 0.5 : 0.22));
      sfx.explode();
      enemies.splice(index, 1);
    }

    function collide() {
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const r = hitRadius(e);
        for (let j = bullets.length - 1; j >= 0; j--) {
          if (bulletHits(bullets[j], e.x, e.y, r)) {
            bullets.splice(j, 1);
            killEnemy(i);
            break;
          }
        }
      }

      if (mode !== "play") return;

      const box = playerBox();
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.kind !== "falcon") continue;
        const hit = circleHitsRect(e.x, e.y, FALCON_R, box) ||
          circleHitsRect(e.prevX, e.prevY, FALCON_R, box);
        if (hit) {
          endGame();
          return;
        }
        if (e.y - FALCON_R > FLOOR) {
          burst(e.x, FLOOR - 4, e.pal.wing, 8, 90);
          enemies.splice(i, 1);
        }
      }
    }

    function updateFx(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.age += dt;
        p.vy += 28 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.age >= p.life) particles.splice(i, 1);
      }
      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i];
        r.age += dt;
        r.r += r.vr * dt;
        if (r.age >= r.life) rings.splice(i, 1);
      }
      for (let i = popups.length - 1; i >= 0; i--) {
        const p = popups[i];
        p.age += dt;
        p.y -= 34 * dt;
        if (p.age >= p.life) popups.splice(i, 1);
      }
      for (let i = flashes.length - 1; i >= 0; i--) {
        flashes[i].age += dt;
        if (flashes[i].age >= flashes[i].life) flashes.splice(i, 1);
      }
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        s.y += (8 + s.z * 28) * dt;
        s.tw += dt * (1.4 + s.z * 2);
        if (s.y > H) {
          s.y = 0;
          s.x = Math.random() * W;
        }
      }
      shake = Math.max(0, shake - dt * 1.8);
      flash = Math.max(0, flash - dt * 2.2);
    }

    // --- 4. Отрисовка ------------------------------------------------------

    function drawStars() {
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        if (s.x < WALL || s.x > W - WALL || s.y > FLOOR) continue;
        const tw = 0.55 + Math.sin(s.tw) * 0.45;
        ctx.globalAlpha = clamp((0.2 + s.z * 0.65) * tw, 0.12, 0.95);
        ctx.fillStyle = s.z > 0.72 ? "#e7f7ff" : "#8ea0c8";
        const size = s.z > 0.84 ? 2 : 1;
        ctx.fillRect(s.x | 0, s.y | 0, size, size);
      }
      ctx.globalAlpha = 1;
    }

    function drawArena() {
      ctx.fillStyle = "#14040e";
      ctx.fillRect(0, 0, WALL, H);
      ctx.fillRect(W - WALL, 0, WALL, H);
      ctx.fillStyle = "#061018";
      ctx.fillRect(0, FLOOR, W, H - FLOOR);

      ctx.save();
      ctx.shadowBlur = 12;
      ctx.lineWidth = 3;
      ctx.shadowColor = "#ff2bd6";
      ctx.strokeStyle = "#ff2bd6";
      ctx.beginPath();
      ctx.moveTo(WALL, 0);
      ctx.lineTo(WALL, FLOOR);
      ctx.moveTo(W - WALL, 0);
      ctx.lineTo(W - WALL, FLOOR);
      ctx.stroke();
      ctx.shadowColor = "#39f3ff";
      ctx.strokeStyle = "#39f3ff";
      ctx.beginPath();
      ctx.moveTo(0, FLOOR);
      ctx.lineTo(W, FLOOR);
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = "rgba(255, 43, 214, 0.9)";
      for (let y = 16; y < FLOOR - 10; y += 28) {
        ctx.fillRect(8, y, 18, 4);
        ctx.fillRect(W - 26, y, 18, 4);
      }
      ctx.fillStyle = "rgba(57, 243, 255, 0.45)";
      for (let x = WALL + 12; x < W - WALL - 12; x += 24) {
        ctx.fillRect(x, FLOOR + 16, 12, 3);
      }
    }

    function drawPlayer() {
      const flick = 5 + Math.sin(time * 42) * 2.4;
      ctx.save();
      ctx.translate(player.x, player.y);

      ctx.fillStyle = "#ffb15a";
      ctx.shadowColor = "#ff7a2a";
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(-3.5, 10);
      ctx.lineTo(0, 10 + flick);
      ctx.lineTo(3.5, 10);
      ctx.fill();

      ctx.shadowColor = "#39f3ff";
      ctx.shadowBlur = 14;
      ctx.fillStyle = "#f4feff";
      ctx.strokeStyle = "#39f3ff";
      ctx.lineWidth = 2;
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(0, -16);
      ctx.lineTo(8, -2);
      ctx.lineTo(16, 6);
      ctx.lineTo(6, 2);
      ctx.lineTo(4, 10);
      ctx.lineTo(-4, 10);
      ctx.lineTo(-6, 2);
      ctx.lineTo(-16, 6);
      ctx.lineTo(-8, -2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.fillStyle = "#062e36";
      ctx.beginPath();
      ctx.moveTo(0, -8);
      ctx.lineTo(4.5, 1);
      ctx.lineTo(-4.5, 1);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      for (let i = 0; i < flashes.length; i++) {
        const f = flashes[i];
        ctx.save();
        ctx.globalAlpha = 1 - f.age / f.life;
        ctx.fillStyle = "#fff6c2";
        ctx.shadowColor = "#fff6c2";
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(f.x, f.y, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawBullet(b) {
      ctx.save();
      ctx.strokeStyle = "#fff6c2";
      ctx.shadowColor = "#ffe14a";
      ctx.shadowBlur = 10;
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(b.x, b.y - 8);
      ctx.lineTo(b.x, b.y + 6);
      ctx.stroke();
      ctx.restore();
    }

    function drawDot(e) {
      const r = dotRadius(e);
      const core = mixHex("#ffe56a", e.pal.wing, e.grow);
      const pulse = 1 + Math.sin(e.pulse) * 0.16;
      const base = ctx.globalAlpha;
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.shadowColor = core;
      ctx.shadowBlur = 16;
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.strokeStyle = core;
      ctx.globalAlpha = base * (0.55 + (Math.sin(e.pulse) * 0.5 + 0.5) * 0.4);
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(0, 0, (r + 5) * pulse, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = base * 0.35;
      ctx.beginPath();
      ctx.arc(0, 0, (r + 11) * (1.05 - Math.sin(e.pulse) * 0.08), 0, Math.PI * 2);
      ctx.stroke();

      ctx.globalAlpha = base;
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(1.2, r * 0.28), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawFalcon(x, y, angle, flap, pal, alpha, scale) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.scale(scale, scale);
      ctx.globalAlpha = alpha;
      ctx.lineJoin = "round";
      ctx.lineWidth = 2;
      ctx.shadowColor = pal.wing;
      ctx.shadowBlur = 12;

      const lift = Math.sin(flap) * 5;
      ctx.fillStyle = pal.wing;
      ctx.strokeStyle = pal.edge;
      ctx.beginPath();
      ctx.moveTo(-3, 0);
      ctx.lineTo(-12, -5 - lift);
      ctx.lineTo(-4, 6);
      ctx.closePath();
      ctx.moveTo(3, 0);
      ctx.lineTo(12, -5 - lift);
      ctx.lineTo(4, 6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = pal.body;
      ctx.beginPath();
      ctx.moveTo(0, 15);
      ctx.lineTo(-5, 3);
      ctx.lineTo(-3, -12);
      ctx.lineTo(3, -12);
      ctx.lineTo(5, 3);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.fillStyle = "#fff3c4";
      ctx.beginPath();
      ctx.moveTo(0, 15);
      ctx.lineTo(-2.2, 9);
      ctx.lineTo(2.2, 9);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#1a060c";
      ctx.fillRect(-2.2, -2, 4.4, 3.2);
      ctx.restore();
    }

    function falconAngle(e) {
      if (e.diveT < 0.4) return Math.sin(e.flap) * 0.12;
      return clamp(Math.atan2(e.vx, Math.max(80, e.vy)), -0.6, 0.6);
    }

    function drawEnemy(e) {
      if (e.kind === "dot") {
        drawDot(e);
        return;
      }
      if (e.kind === "morph") {
        const k = 1 - e.morph / MORPH_TIME;
        ctx.save();
        ctx.globalAlpha = 1 - k;
        drawDot(e);
        ctx.restore();
        drawFalcon(e.x, e.y, Math.sin(e.pulse) * 0.35, e.pulse, e.pal, 0.35 + k * 0.65, 0.35 + k * 0.65);
        return;
      }
      for (let i = 0; i < e.trail.length; i++) {
        const p = e.trail[i];
        const a = ((i + 1) / (e.trail.length + 1)) * 0.28;
        drawFalcon(p.x, p.y, falconAngle(e), e.flap, e.pal, a, 1);
      }
      drawFalcon(e.x, e.y, falconAngle(e), e.flap, e.pal, 1, 1);
    }

    function drawFx() {
      for (let i = 0; i < rings.length; i++) {
        const r = rings[i];
        ctx.save();
        ctx.globalAlpha = 1 - r.age / r.life;
        ctx.strokeStyle = r.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        ctx.globalAlpha = 1 - p.age / p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.globalAlpha = 1;
      ctx.font = "bold 16px Courier New, monospace";
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffe56a";
      for (let i = 0; i < popups.length; i++) {
        const p = popups[i];
        ctx.globalAlpha = 1 - p.age / p.life;
        ctx.fillText(p.text, p.x, p.y);
      }
      ctx.globalAlpha = 1;
    }

    function drawHud() {
      if (mode === "menu") return;
      ctx.save();
      ctx.font = "18px Courier New, monospace";
      ctx.textBaseline = "top";
      ctx.shadowBlur = 8;
      ctx.textAlign = "left";
      ctx.fillStyle = "#c6ff6a";
      ctx.shadowColor = "#7CFF6B";
      ctx.fillText("SCORE " + pad(score), WALL + 12, 14);
      ctx.textAlign = "right";
      ctx.fillStyle = "#8ef6ff";
      ctx.shadowColor = "#39f3ff";
      ctx.fillText("BEST " + pad(best), W - WALL - 12, 14);
      if (mode === "play") {
        ctx.shadowBlur = 0;
        ctx.textAlign = "center";
        ctx.font = "13px Courier New, monospace";
        ctx.fillStyle = "rgba(57, 243, 255, 0.75)";
        ctx.fillText("←   →      SPACE", W / 2, FLOOR + 18);
      }
      ctx.restore();
    }

    function drawAttract() {
      const bob = Math.sin(time * 1.3) * 16;
      drawFalcon(112, 168 + bob, Math.sin(time * 2) * 0.35, time * 11, PALETTES[0], 0.92, 0.95);
      drawDot({
        x: W - 112,
        y: 176 - bob,
        grow: 0.4 + (Math.sin(time * 0.7) * 0.5 + 0.5) * 0.45,
        pulse: time * 7,
        pal: PALETTES[1],
      });
    }

    function render() {
      const mag = shake * 7;
      const ox = (Math.random() - 0.5) * mag;
      const oy = (Math.random() - 0.5) * mag;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);
      ctx.setTransform(dpr, 0, 0, dpr, ox * dpr, oy * dpr);

      drawStars();
      drawArena();
      for (let i = 0; i < bullets.length; i++) drawBullet(bullets[i]);
      if (mode === "menu") drawAttract();
      for (let i = 0; i < enemies.length; i++) drawEnemy(enemies[i]);
      drawPlayer();
      drawFx();

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawHud();
      if (flash > 0) {
        ctx.fillStyle = "rgba(255,255,255," + (flash * 0.7) + ")";
        ctx.fillRect(0, 0, W, H);
      }
    }

    // --- 5. Цикл 60 Гц и управление ----------------------------------------

    function update(dt) {
      time += dt;
      if (mode === "play") {
        elapsed += dt;
        updatePlayer(dt);
        updateSpawn(dt);
        updateBullets(dt);
        updateEnemies(dt);
        collide();
      }
      updateFx(dt);
    }

    let last = 0;
    let acc = 0;

    function frame(now) {
      if (!last) last = now;
      acc += Math.min(0.1, (now - last) / 1000);
      last = now;
      let steps = 0;
      while (acc >= STEP && steps < 5) {
        update(STEP);
        acc -= STEP;
        steps += 1;
      }
      render();
      requestAnimationFrame(frame);
    }

    function onKeyDown(e) {
      if (e.key === " " || e.key === "ArrowLeft" || e.key === "ArrowRight" ||
          e.key === "ArrowUp" || e.key === "ArrowDown") {
        e.preventDefault();
      }
      if (e.key === "ArrowLeft") keys.left = true;
      if (e.key === "ArrowRight") keys.right = true;

      if (e.key === " " || e.key === "Enter") {
        if (e.repeat) return;
        if (mode !== "play") {
          startGame();
          return;
        }
        if (e.key === " ") shoot();
      }
    }

    function onKeyUp(e) {
      if (e.key === "ArrowLeft") keys.left = false;
      if (e.key === "ArrowRight") keys.right = false;
    }

    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keyup", onKeyUp);
    window.addEventListener("blur", () => {
      keys.left = false;
      keys.right = false;
    });
    window.addEventListener("resize", fitCanvas);
    actionEl.addEventListener("click", () => {
      if (mode !== "play") startGame();
    });

    fitCanvas();
    showMenu();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
